name: opendash_companion
description: "Installs, updates and removes OpenDash on an Ola S1 head unit."
publish_to: 'none'
version: 0.2.0-beta.4+5

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  flutter_riverpod: ^3.0.0
  shared_preferences: ^2.5.6
  http: ^1.5.0
  crypto: ^3.0.6
  file_picker: ^10.3.0
  url_launcher: ^6.3.2
  archive: ^4.7.1
  workmanager: ^0.10.10
  flutter_local_notifications: ^23.0.4
  nsd: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^30.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/licenses/
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
